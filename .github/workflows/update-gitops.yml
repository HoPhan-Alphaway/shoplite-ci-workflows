# Reusable: bump image.tag of one service in the gitops repo. ArgoCD picks the commit up and rolls out.
#
# CI never talks to the cluster. Its only "deploy" action is a git commit — that is GitOps.
name: update-gitops

on:
  workflow_call:
    inputs:
      service:
        description: Folder under apps/ in the gitops repo, e.g. product-service
        type: string
        required: true
      tag:
        type: string
        required: true
      environment:
        type: string
        default: dev
      gitops-repo:
        type: string
        default: HoPhan-Alphaway/shoplite-gitops
    secrets:
      GITOPS_DEPLOY_KEY:
        description: SSH private key of a write deploy key on the gitops repo
        required: true

permissions:
  contents: read

concurrency:
  # Several services may finish at once; serialize per environment to reduce push races.
  group: update-gitops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repo }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set image tag
        env:
          FILE: apps/${{ inputs.service }}/values-${{ inputs.environment }}.yaml
          TAG: ${{ inputs.tag }}
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$FILE" || { echo "::error::$FILE not found in gitops repo"; exit 1; }
          yq -i '.image.tag = strenv(TAG)' "$FILE"   # yq is preinstalled on ubuntu runners

          git config user.name  "shoplite-ci[bot]"
          git config user.email "shoplite-ci@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Tag already $TAG, nothing to do"; exit 0
          fi
          git commit -m "chore(${SERVICE}): deploy ${TAG:0:7} to ${ENVIRONMENT}" -m "Source: ${SOURCE}"

          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            echo "push rejected, retry $i"; sleep $((i * 3))
          done
          exit 1
